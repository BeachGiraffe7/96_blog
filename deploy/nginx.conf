# 云服务器（Nginx）部署示例
# 用法：npm run build 后把 dist/ 上传到 /var/www/blog，然后把本文件内容放进
#      /etc/nginx/conf.d/blog.conf，执行 nginx -t && systemctl reload nginx

server {
    listen 80;
    server_name your-domain.com;          # 换成你的域名或服务器 IP

    root /var/www/blog;
    index index.html;

    # 前端路由回退：/post/xxx、/moments 这类地址刷新时仍返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存（文件名带 hash，可放心缓存一年）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 笔记图片
    location /notes/ {
        expires 30d;
        add_header Cache-Control "public";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
    gzip_min_length 1024;
}
